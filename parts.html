<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parts Management - Esthetics Auto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .coming-soon-container {
            text-align: center;
            background: white;
            padding: 60px 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            animation: fadeInUp 0.8s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .icon-container {
            font-size: 90px;
            color: #667eea;
            margin-bottom: 25px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        h1 {
            font-size: 2.8rem;
            color: #333;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 1.3rem;
            color: #666;
            margin-bottom: 30px;
        }
        .developer-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            margin-top: 30px;
            font-size: 1.1rem;
        }
        .developer-name {
            font-weight: 700;
            font-size: 1.4rem;
            margin-top: 8px;
        }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .back-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .back-btn i {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="coming-soon-container">
        <div class="icon-container">
            <i class="fas fa-cogs"></i>
        </div>
        <h1>Coming Soon</h1>
        <p class="subtitle">Parts Management Module</p>
        <div class="developer-info">
            <i class="fas fa-code"></i> Currently Under Development
            <div class="developer-name">
                <i class="fas fa-user-tie"></i> Qasim is Working on This
            </div>
        </div>
    </div>
</body>
</html>
